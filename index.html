<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resize & Compress Images Online | Resize files</title>
    <meta name="description" content="Resize photos, compress images to a specific KB size, convert image formats, and prepare photos for forms, exams and applications. Your files are processed directly in your browser." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#059669" />
    <meta property="og:title" content="Resize & Compress Images Online | Resize files" />
    <meta property="og:description" content="Resize photos, compress images to a specific KB size, convert image formats, and prepare photos for forms, exams and applications." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://resizefiles.netlify.app/" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a;">
        <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;"></div>
        <div style="font-weight: 700; font-size: 15px; color: #1e293b;">Loading Resize Files...</div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker handling with auto-update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.warn('SW registration: ', err);
          });
        });
      }

      // Automatically recover if an older browser session requests stale chunk hashes
      window.addEventListener('error', (e) => {
        if (e && e.message && (e.message.includes('Loading chunk') || e.message.includes('dynamically imported module') || e.message.includes('Failed to fetch'))) {
          if (!sessionStorage.getItem('chunk_reload_attempted')) {
            sessionStorage.setItem('chunk_reload_attempted', '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then((regs) => {
                for (let r of regs) r.unregister();
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
    </script>
  </body>
</html>

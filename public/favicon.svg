<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Sleek dark base with emerald neon glow border -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="url(#neonGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Dynamic Compression Scale Icon & Letter R -->
  <path d="M18 18h12c5 0 9 3 9 7s-4 7-9 7H18v14h-5V18h5zm0 18h7c2.5 0 4-1.5 4-3.5s-1.5-3.5-4-3.5H18v7z" fill="#ffffff"/>
  <path d="M42 22l6-6m0 0h-4m4 0v4" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 42l6 6m0 0h-4m4 0v-4" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  {/* KB Badge */}
  <rect x="34" y="38" width="22" height="14" rx="4" fill="url(#neonGrad)"/>
  <text x="45" y="48" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#0f172a" text-anchor="middle">KB</text>
</svg>
